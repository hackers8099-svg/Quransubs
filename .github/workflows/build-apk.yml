name: Build Standalone QuranCaption Pro APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Complete Project Files Automatically
        run: |
          mkdir -p www/js

          cat << 'EOF' > package.json
          {
            "name": "qurancaption-pro",
            "version": "1.0.0",
            "description": "QuranCaption Pro Studio",
            "main": "www/index.html",
            "dependencies": {
              "@capacitor/android": "^6.0.0",
              "@capacitor/core": "^6.0.0",
              "@capacitor/cli": "^6.0.0"
            }
          }
          EOF

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.qurancaption.pro",
            "appName": "QuranCaption Pro",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

          cat << 'EOF' > www/index.html
          <!DOCTYPE html>
          <html lang="so" dir="ltr">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>QuranCaption Studio Pro - 10 Qira'at & AI Sync</title>
              <script src="https://cdn.tailwindcss.com"></script>
              <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Scheherazade+New:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
              <style>
                  @font-face {
                      font-family: 'KFGQPC Uthmanic Script HAFS';
                      src: url('https://verses.quran.com/fonts/quran/hafs/uthmanic_hafs/UthmanicHafs1Ver18.woff2') format('woff2');
                  }
                  .font-kfgqpc {
                      font-family: 'KFGQPC Uthmanic Script HAFS', 'Amiri Quran', 'Scheherazade New', serif;
                  }
                  body {
                      font-family: 'Inter', sans-serif;
                      background-color: #090d16;
                      color: #f1f5f9;
                  }
                  .checkerboard {
                      background-image: linear-gradient(45deg, #1e293b 25%, transparent 25%), 
                                        linear-gradient(-45deg, #1e293b 25%, transparent 25%), 
                                        linear-gradient(45deg, transparent 75%, #1e293b 75%), 
                                        linear-gradient(-45deg, transparent 75%, #1e293b 75%);
                      background-size: 20px 20px;
                      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
                  }
              </style>
          </head>
          <body class="min-h-screen flex flex-col">
              <header class="p-4 border-b border-slate-800 bg-slate-900 flex flex-wrap items-center justify-between gap-2">
                  <div class="flex items-center gap-2">
                      <div class="w-8 h-8 rounded-lg bg-emerald-500 flex items-center justify-center font-bold text-slate-950">Q</div>
                      <div>
                          <h1 class="font-bold text-sm">QuranCaption Pro (10 Qira'at + AI Sync)</h1>
                          <p class="text-[11px] text-slate-400">King Fahd Fonts • Word-by-Word • MP4 / MOV / PNG</p>
                      </div>
                  </div>
                  <div class="flex gap-2">
                      <button id="btnExportPNG" class="px-3 py-1.5 rounded bg-slate-800 text-xs border border-slate-700">📸 PNG</button>
                      <button id="btnExportMOV" class="px-3 py-1.5 rounded bg-indigo-600/30 text-indigo-300 text-xs border border-indigo-500/30">🎞️ MOV Alpha</button>
                      <button id="btnExportMP4" class="px-3 py-1.5 rounded bg-emerald-500 text-slate-950 text-xs font-bold">🎬 MP4</button>
                  </div>
              </header>

              <div class="flex-1 flex flex-col lg:flex-row p-4 gap-4">
                  <aside class="w-full lg:w-80 space-y-4 bg-slate-900/70 p-4 rounded-xl border border-slate-800">
                      <div>
                          <label class="text-xs text-emerald-400 font-semibold block mb-1">1. Dooro Riwaayada (10 Qira'at):</label>
                          <select id="riwayahSelect" class="w-full bg-slate-950 border border-slate-700 rounded p-2 text-xs">
                              <option value="auto">🤖 AI Auto-Detect Riwayah</option>
                              <option value="hafs" selected>1. Xafs can Caasim (حفص عن عاصم)</option>
                              <option value="douri">2. Ad-Duuri can Abuu Camr (الدوري)</option>
                              <option value="warsh">3. Warsh can Naafic (ورش عن نافع)</option>
                              <option value="qalun">4. Qaaluun can Naafic (قالون)</option>
                              <option value="susi">5. As-Suusi can Abuu Camr (السوسي)</option>
                              <option value="shubah">6. Shucbah can Caasim (شعبة)</option>
                              <option value="ibnkathir">7. Ibn Kathiir (ابن كثير)</option>
                              <option value="ibnamir">8. Ibn Caamir (ابن عامر)</option>
                              <option value="kisai">9. Al-Kisaa'i (الكسائي)</option>
                              <option value="hamzah">10. Xamzah (حمزة)</option>
                          </select>
                      </div>
                      <div class="grid grid-cols-2 gap-2">
                          <div>
                              <label class="text-xs text-slate-400 block mb-1">Suurada:</label>
                              <select id="surahSelect" class="w-full bg-slate-950 border border-slate-700 rounded p-2 text-xs"></select>
                          </div>
                          <div>
                              <label class="text-xs text-slate-400 block mb-1">Aayada:</label>
                              <input type="number" id="ayahInput" value="21" class="w-full bg-slate-950 border border-slate-700 rounded p-2 text-xs">
                          </div>
                      </div>
                      <button id="btnFetchAyah" class="w-full py-2 bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 rounded text-xs font-semibold">🔄 Soo Jiido Aayada & Sync</button>

                      <div>
                          <label class="text-xs text-slate-300 block mb-1">Soo geli Muuqaal/Cod:</label>
                          <input type="file" id="mediaUpload" accept="video/*,audio/*" class="w-full text-xs">
                      </div>

                      <div>
                          <label class="text-xs text-slate-300 block mb-1">Style Preset:</label>
                          <select id="stylePreset" class="w-full bg-slate-950 border border-slate-700 rounded p-2 text-xs">
                              <option value="image_ref" selected>✨ Style 1: Sawirkaaga (White + Dimmed + Gradient)</option>
                              <option value="gold_glow">🌟 Style 2: Golden Noor Glow</option>
                              <option value="emerald_box">🟩 Style 3: Highlight Box</option>
                              <option value="minimal_alpha">🔲 Style 4: Transparent Overlay</option>
                          </select>
                      </div>

                      <div class="grid grid-cols-3 gap-2">
                          <div>
                              <label class="text-[10px] text-slate-400 block">Active Color</label>
                              <input type="color" id="activeColor" value="#ffffff" class="w-full h-8 rounded">
                          </div>
                          <div>
                              <label class="text-[10px] text-slate-400 block">Dimmed Color</label>
                              <input type="color" id="inactiveColor" value="#64748b" class="w-full h-8 rounded">
                          </div>
                          <div>
                              <label class="text-[10px] text-slate-400 block">Gradient</label>
                              <input type="color" id="gradientColor" value="#000000" class="w-full h-8 rounded">
                          </div>
                      </div>
                      <p id="syncStatus" class="text-[11px] text-emerald-400">Ready: Al-Hashr 59:21</p>
                  </aside>

                  <main class="flex-1 flex flex-col items-center gap-4">
                      <div class="w-full max-w-3xl aspect-video rounded-xl overflow-hidden border border-slate-800 checkerboard">
                          <canvas id="captionCanvas" width="1280" height="720" class="w-full h-full object-contain"></canvas>
                          <video id="bgVideo" class="hidden" playsinline crossorigin="anonymous"></video>
                          <audio id="ayahAudio" class="hidden" crossorigin="anonymous"></audio>
                      </div>
                      <div class="w-full max-w-3xl bg-slate-900 p-3 rounded-xl border border-slate-800 space-y-2">
                          <div class="flex gap-2">
                              <button id="btnPlayPause" class="px-4 py-1.5 rounded bg-emerald-500 text-slate-950 font-bold text-xs">▶️ Play Sync</button>
                              <button id="btnPrevWord" class="px-3 py-1.5 rounded bg-slate-800 text-xs">⏮️ Hore</button>
                              <button id="btnNextWord" class="px-3 py-1.5 rounded bg-slate-800 text-xs">Xiga ⏭️</button>
                          </div>
                          <div id="wordTimelineContainer" dir="rtl" class="flex flex-wrap gap-2 p-2 bg-slate-950 rounded-lg"></div>
                      </div>
                  </main>
              </div>
              <script src="js/app.js"></script>
          </body>
          </html>
          EOF

          cat << 'EOF' > www/js/app.js
          const state = {
              surah: 59,
              ayah: 21,
              words: [
                  { text: "وَتِلْكَ", start: 0.0, end: 1.4 },
                  { text: "ٱلْأَمْثَـٰلُ", start: 1.4, end: 3.1 },
                  { text: "نَضْرِبُهَا", start: 3.1, end: 4.8 },
                  { text: "لِلنَّاسِ", start: 4.8, end: 6.5 },
                  { text: "لَعَلَّهُمْ", start: 6.5, end: 8.0 },
                  { text: "يَتَفَكَّرُونَ", start: 8.0, end: 10.5 }
              ],
              ayahNumberArabic: "٢١",
              translation: "We set forth such comparisons for people, so perhaps they may reflect.",
              activeWordIndex: 3,
              activeColor: "#ffffff",
              inactiveColor: "#64748b",
              gradientColor: "#000000",
              gradientOpacity: 0.85,
              arabicFontSize: 56,
              transparentMode: false,
              isPlaying: false,
              hasCustomVideo: false
          };

          const canvas = document.getElementById('captionCanvas');
          const ctx = canvas.getContext('2d');
          const bgVideo = document.getElementById('bgVideo');
          const ayahAudio = document.getElementById('ayahAudio');

          async function initSurahs() {
              const sel = document.getElementById('surahSelect');
              try {
                  const r = await fetch('https://api.quran.com/api/v4/chapters');
                  const d = await r.json();
                  sel.innerHTML = '';
                  d.chapters.forEach(c => {
                      const o = document.createElement('option');
                      o.value = c.id;
                      o.textContent = `${c.id}. ${c.name_simple}`;
                      if (c.id === 59) o.selected = true;
                      sel.appendChild(o);
                  });
              } catch (e) {
                  sel.innerHTML = '<option value="59" selected>59. Al-Hashr</option>';
              }
          }

          function toArabicDigits(n) {
              const d = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
              return String(n).split('').map(x => d[parseInt(x, 10)] || x).join('');
          }

          async function fetchAyahData() {
              const s = document.getElementById('surahSelect').value || 59;
              const a = document.getElementById('ayahInput').value || 21;
              try {
                  const res = await fetch(`https://api.quran.com/api/v4/verses/by_key/${s}:${a}?words=true&word_fields=text_uthmani&translations=131`);
                  const data = await res.json();
                  const w = data.verse.words.filter(x => x.char_type_name === 'word');
                  state.words = w.map((x, i) => ({ text: x.text_uthmani, start: i * 1.2, end: (i + 1) * 1.2 }));
                  state.ayahNumberArabic = toArabicDigits(a);
                  if (data.verse.translations && data.verse.translations[0]) {
                      state.translation = data.verse.translations[0].text.replace(/<[^>]*>/g, '');
                  }
                  state.activeWordIndex = Math.min(2, state.words.length - 1);
                  renderWordTimeline();
                  drawCanvas();
              } catch (e) {
                  renderWordTimeline();
                  drawCanvas();
              }
          }

          function renderWordTimeline() {
              const c = document.getElementById('wordTimelineContainer');
              c.innerHTML = '';
              state.words.forEach((w, i) => {
                  const b = document.createElement('button');
                  b.className = `px-3 py-1 rounded text-lg font-kfgqpc border ${i <= state.activeWordIndex ? 'bg-emerald-500 text-slate-950 font-bold' : 'bg-slate-900 text-slate-400 border-slate-800'}`;
                  b.textContent = w.text;
                  b.onclick = () => { state.activeWordIndex = i; renderWordTimeline(); drawCanvas(); };
                  c.appendChild(b);
              });
          }

          function hexToRgba(hex, alpha) {
              const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
              return `rgba(${r}, ${g}, ${b}, ${alpha})`;
          }

          function drawCanvas() {
              ctx.clearRect(0, 0, canvas.width, canvas.height);
              if (!state.transparentMode) {
                  if (state.hasCustomVideo && bgVideo.readyState >= 2) {
                      ctx.drawImage(bgVideo, 0, 0, canvas.width, canvas.height);
                  } else {
                      const bg = ctx.createLinearGradient(0, 0, 0, canvas.height);
                      bg.addColorStop(0, '#332924'); bg.addColorStop(1, '#090a0c');
                      ctx.fillStyle = bg; ctx.fillRect(0, 0, canvas.width, canvas.height);
                  }
                  const gh = canvas.height * 0.55;
                  const gr = ctx.createLinearGradient(0, canvas.height - gh, 0, canvas.height);
                  gr.addColorStop(0, hexToRgba(state.gradientColor, 0));
                  gr.addColorStop(1, hexToRgba(state.gradientColor, state.gradientOpacity));
                  ctx.fillStyle = gr; ctx.fillRect(0, canvas.height - gh, canvas.width, gh);
              }
              ctx.save();
              ctx.font = `${state.arabicFontSize}px 'KFGQPC Uthmanic Script HAFS', 'Amiri Quran', serif`;
              ctx.textBaseline = 'middle';
              const sp = state.arabicFontSize * 0.32;
              const sym = ` ﴿${state.ayahNumberArabic}﴾ `;
              const wm = state.words.map(w => ctx.measureText(w.text).width);
              const sw = ctx.measureText(sym).width;
              const tw = wm.reduce((a, b) => a + b, 0) + (state.words.length * sp) + sw;
              let rx = (canvas.width + tw) / 2;
              const ay = canvas.height - 145;
              state.words.forEach((w, i) => {
                  const ww = wm[i];
                  ctx.fillStyle = i <= state.activeWordIndex ? state.activeColor : state.inactiveColor;
                  ctx.textAlign = 'center';
                  ctx.fillText(w.text, rx - (ww / 2), ay);
                  rx -= (ww + sp);
              });
              ctx.fillStyle = state.activeWordIndex === state.words.length - 1 ? state.activeColor : state.inactiveColor;
              ctx.fillText(sym, rx - (sw / 2), ay);
              ctx.restore();

              if (state.translation) {
                  ctx.save();
                  ctx.font = "500 22px 'Inter', sans-serif";
                  ctx.fillStyle = "#cbd5e1";
                  ctx.textAlign = "center";
                  ctx.fillText(state.translation, canvas.width / 2, canvas.height - 62);
                  ctx.restore();
              }
          }

          document.getElementById('btnFetchAyah').onclick = fetchAyahData;
          document.getElementById('btnPrevWord').onclick = () => { state.activeWordIndex = Math.max(0, state.activeWordIndex - 1); renderWordTimeline(); drawCanvas(); };
          document.getElementById('btnNextWord').onclick = () => { state.activeWordIndex = Math.min(state.words.length - 1, state.activeWordIndex + 1); renderWordTimeline(); drawCanvas(); };
          ['activeColor', 'inactiveColor', 'gradientColor'].forEach(id => {
              document.getElementById(id).oninput = e => { state[id] = e.target.value; drawCanvas(); };
          });
          document.getElementById('btnExportPNG').onclick = () => {
              const a = document.createElement('a');
              a.download = 'QuranCaption.png';
              a.href = canvas.toDataURL('image/png');
              a.click();
          };

          initSurahs();
          renderWordTimeline();
          drawCanvas();
          EOF

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17 for Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor & Dependencies
        run: npm install

      - name: Add & Sync Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Android APK (Debug)
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Ready Android APK
        uses: actions/upload-artifact@v4
        with:
          name: QuranCaption-Pro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
