name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android scaffold
        run: flutter create --platforms=android --org com.somquran --project-name quran_captions .

      - name: Patch minSdk and INTERNET permission
        run: |
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i -E 's/minSdk(Version)?[ =]+flutter\.minSdkVersion/minSdk = 24/' "$f"
            fi
          done
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label="[^"]*"|android:label="Quran Captions"|' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --no-shrink --target-platform android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: quran-captions-apk
          path: build/app/outputs/flutter-apk/app-release.apk
